<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yakup Prompt Kütüphanesi</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#0b0b0f;color:#f5f5f7}
.container{max-width:1100px;margin:auto;padding:32px 20px 60px}
header{padding:25px 0 30px}.brand{font-size:28px;font-weight:800}.muted{color:#a5a5b0}
.hero{background:linear-gradient(135deg,#171720,#101016);border:1px solid #292934;border-radius:24px;padding:34px;margin-bottom:22px}
.hero h1{margin:0 0 10px;font-size:42px;line-height:1.05}.hero p{margin:0 0 24px;color:#b9b9c4}
.search{width:100%;padding:16px 18px;border-radius:14px;border:1px solid #33333f;background:#0b0b0f;color:white;font-size:16px;outline:none}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.filter{border:1px solid #30303a;background:#15151c;color:#ddd;padding:10px 14px;border-radius:999px;cursor:pointer}.filter.active{background:#fff;color:#111}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#121219;border:1px solid #292933;border-radius:18px;padding:20px;display:flex;flex-direction:column;min-height:220px}.tag{font-size:12px;color:#aaa;margin-bottom:12px}.card h3{margin:0 0 10px;font-size:19px}.card p{color:#aaa;line-height:1.5;font-size:14px;flex:1}.actions{display:flex;gap:8px}.btn{border:0;border-radius:10px;padding:10px 13px;cursor:pointer;font-weight:700}.primary{background:#fff;color:#111}.secondary{background:#25252e;color:#fff}
.empty{padding:40px;text-align:center;color:#aaa;border:1px dashed #333;border-radius:18px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.show{display:flex}.modalbox{max-width:800px;width:100%;max-height:90vh;overflow:auto;background:#121219;border:1px solid #33333e;border-radius:20px;padding:24px}.modalbox h2{margin-top:0}.prompt{white-space:pre-wrap;background:#09090d;border:1px solid #2b2b35;border-radius:14px;padding:18px;line-height:1.6;color:#ddd}.close{float:right;background:#25252e;color:white;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}.form{display:grid;gap:12px}.form input,.form select,.form textarea{width:100%;background:#0b0b0f;border:1px solid #33333f;color:white;border-radius:10px;padding:12px}.form textarea{min-height:180px;resize:vertical}
footer{text-align:center;color:#777;margin-top:35px;font-size:13px}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:34px}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.container{padding:20px 14px}.hero{padding:24px}}
</style>
</head>
<body>
<div class="container">
<header><div class="brand">YAKUP <span class="muted">PROMPT KÜTÜPHANESİ</span></div></header>

<section class="hero">
<h1>AI Promptlarını Tek Yerde Topla.</h1>
<p>Kendi prompt arşivini oluştur, ara ve tek tıkla kopyala.</p>
<input id="search" class="search" placeholder="Prompt ara...">
</section>

<div class="toolbar" id="filters"></div>
<div id="grid" class="grid"></div>
<footer>Yakup Prompt Kütüphanesi · AI içerik üretimi</footer>
</div>

<div id="modal" class="modal">
<div class="modalbox">
<button class="close" onclick="closeModal()">Kapat</button>
<h2 id="modalTitle"></h2>
<div class="tag" id="modalCategory"></div>
<div class="prompt" id="modalPrompt"></div>
<br>
<button class="btn primary" onclick="copyCurrent()">Promptu Kopyala</button>
</div>
</div>

<script>
const defaults=[
{id:1,title:"Sinematik Ürün Reklamı",category:"AI Video",description:"Ürün fotoğrafını sinematik reklam videosuna dönüştürmek için başlangıç promptu.",prompt:"Create a photorealistic cinematic product advertisement. Preserve the exact product design, packaging, logo, colors and all visible text. Natural realistic lighting, premium commercial look, subtle camera movement, realistic materials, detailed textures, no distortion, no extra objects, no AI-looking artifacts. Vertical 9:16 composition."},
{id:2,title:"Karakter Referans Sayfası",category:"AI Image",description:"Aynı karakteri farklı açılarda tutarlı üretmek için referans promptu.",prompt:"Create a professional character reference sheet showing the same person from multiple angles. Preserve the exact identity, facial structure, skin tone, eye shape, eyebrows, hairstyle and proportions across every view. Studio lighting, neutral background, realistic skin texture, photorealistic photography, no smile, no accessories unless specified."},
{id:3,title:"Ürün Fotoğrafından AI Manken",category:"AI Image",description:"Moda ürününü gerçekçi bir AI model üzerinde göstermek için.",prompt:"Create a photorealistic fashion campaign image using the provided clothing product. The garment must remain exactly faithful to the reference: preserve fabric, cut, stitching, pattern, color and proportions. Place it naturally on a realistic fashion model. Premium studio photography, realistic skin texture, natural anatomy, soft commercial lighting, clean background, no plastic skin, no AI artifacts."},
{id:4,title:"Seedance Sinematik Sahne",category:"Seedance",description:"Kamera hareketi ve karakter aksiyonunu kontrollü üretmek için.",prompt:"Create a cinematic photorealistic video. Preserve the reference composition, characters, environment and visual identity. The camera performs a smooth controlled cinematic movement while the characters perform natural continuous actions. Realistic body physics, natural facial motion, consistent lighting, stable background, no morphing, no extra limbs, no sudden camera cuts. Vertical 9:16."},
{id:5,title:"Kling Gerçekçi Video",category:"Kling",description:"Gerçekçi hareket ve kamera kontrolü için.",prompt:"Generate a highly realistic cinematic video from the reference image. Keep the subject identity, clothing, environment and composition consistent. Natural human movement, realistic physics, subtle camera motion, physically accurate lighting and shadows. No identity changes, no object deformation, no flickering, no duplicated elements."},
{id:6,title:"Nano Banana Ürün Düzenleme",category:"Nano Banana",description:"Ürünün kendisini bozmadan sahneyi değiştirmek için.",prompt:"Edit the provided image while preserving the exact product identity. Do not alter the product shape, packaging, logo, typography, colors or visible text. Change only the requested environment and composition. Maintain realistic perspective, shadows, reflections and lighting. Photorealistic commercial product photography."}
{id:7,title:"Storm Akımı",category:"Seedance",description:"Referans videonun hareket, kamera ve koreografisini koruyarak ana karakteri çocukla, kalabalığı antropomorfik karakterlerle ve sigarayı lollipop ile değiştiren video promptu.",prompt:`Use the uploaded reference video as the master reference for the entire video.
Preserve the reference video's original shot sequence, camera movement, framing, lens perspective, timing, pacing, choreography, blocking, walking path, body movements, background, lighting, composition and overall visual style.

Make ONLY these three changes:

1. Replace the cigarette action in the opening with a colorful lollipop.
The main character naturally holds the lollipop, brings it to his mouth once, briefly sucks it once, then lowers it.
Do not add any other prop or action.

2. Replace the original main character with the child shown in the uploaded character reference image.
Keep the child's face, hairstyle, clothing, body proportions and overall appearance consistent throughout the entire video.

3. Replace every person in the crowd with the anthropomorphic cartoon characters shown in the uploaded crowd reference image.
Every crowd member must remain the same type of anthropomorphic cartoon animal throughout the entire video.

IMPORTANT PERFORMANCE RULES:

The child must follow the reference video's original movement exactly.
He must walk in the same direction, along the same path, at the same pace and with the same body movement as the original main character.
The child must NOT walk backwards.
The child must NOT stop in front of the crowd.
The child must continue walking naturally until he reaches the same position within the crowd as the original main character.
The child does NOT dance.
The child does NOT perform the crowd choreography.
After reaching his position, he remains in his position exactly as the original main character does in the reference video.

Only the crowd performs the synchronized dance movements from the reference video.

All crowd characters must remain cool, serious and confident.
No smiling, no laughing, no exaggerated facial expressions, no playful expressions.
The crowd must remain anthropomorphic animals at all times.
No crowd member may become, transform into, or resemble a human.
No human faces, human bodies or human characters are allowed in the crowd.

Do not change the number or arrangement of the crowd unnecessarily.
Do not create a new scene.
Do not invent new movements.
Do not change the walking direction.
Do not add camera movements.
Do not add transitions.
Do not alter the original sequence.

The final result should feel like the original reference video with only:
- the cigarette replaced by one brief lollipop action
- the main character replaced by the child
- the human crowd replaced by the uploaded anthropomorphic cartoon characters`},
];

let prompts=JSON.parse(localStorage.getItem("yakup_prompts")||"null")||defaults;
let current=null;
const categories=["Tümü",...new Set(prompts.map(x=>x.category))];
let active="Tümü";

function renderFilters(){
 const el=document.getElementById("filters"); el.innerHTML="";
 [...new Set(["Tümü",...prompts.map(x=>x.category)])].forEach(c=>{
  const b=document.createElement("button"); b.className="filter "+(active===c?"active":""); b.textContent=c;
  b.onclick=()=>{active=c;renderFilters();render()}; el.appendChild(b);
 });
}
function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const list=prompts.filter(x=>(active==="Tümü"||x.category===active)&&
 (x.title.toLowerCase().includes(q)||x.description.toLowerCase().includes(q)||x.prompt.toLowerCase().includes(q)));
 const grid=document.getElementById("grid");
 if(!list.length){grid.className="";grid.innerHTML='<div class="empty">Aradığın prompt bulunamadı.</div>';return}
 grid.className="grid";
 grid.innerHTML=list.map(x=>`<article class="card">
 <div class="tag">${escapeHtml(x.category)}</div>
 <h3>${escapeHtml(x.title)}</h3>
 <p>${escapeHtml(x.description)}</p>
 <div class="actions"><button class="btn primary" onclick="openPrompt(${x.id})">Promptu Gör</button>
 <button class="btn secondary" onclick="copyPrompt(${x.id})">Kopyala</button></div>
 </article>`).join("");
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function openPrompt(id){
 current=prompts.find(x=>x.id===id);
 document.getElementById("modalTitle").textContent=current.title;
 document.getElementById("modalCategory").textContent=current.category;
 document.getElementById("modalPrompt").textContent=current.prompt;
 document.getElementById("modal").classList.add("show");
}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function copyPrompt(id){
 const p=prompts.find(x=>x.id===id);
 navigator.clipboard.writeText(p.prompt).then(()=>alert("Prompt kopyalandı."));
}
function copyCurrent(){if(current) copyPrompt(current.id)}
document.getElementById("search").addEventListener("input",render);
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
renderFilters();render();
</script>
</body>
</html>
